# Branches: dev (not deployed) -> staging (branch deploy) -> main (live).
# Set in the Netlify UI (Project configuration > Developer settings >
# Continuous deployment > Branches and deploy contexts), not here:
#   Production branch: main
#   Branch deploys: "Let me add individual branches" -> staging
# Non-production builds get a header label and a noindex tag (vite.config.ts).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The engine lives in a versioned folder and Vite fingerprints its own assets,
# so both can be cached for a year.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
