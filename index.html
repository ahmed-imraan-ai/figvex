<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Figvex: free online diagram editor for PlantUML, Mermaid and more</title>
    <meta name="description" content="Free online diagram editor. Write PlantUML, Mermaid, Graphviz, BPMN, network diagrams, org charts and data charts as text, or sketch by hand, in your browser." />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Figvex" />
    <meta property="og:title" content="Figvex: free online diagram editor for PlantUML, Mermaid and more" />
    <meta property="og:description" content="Write PlantUML, Mermaid, Graphviz, BPMN, network diagrams, org charts and data charts as text, or sketch by hand. Free, open source, and runs in your browser." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Figvex editor with a network diagram written as text next to the drawing" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Figvex: free online diagram editor for PlantUML, Mermaid and more" />
    <meta name="twitter:description" content="Write PlantUML, Mermaid, Graphviz, BPMN, network diagrams, org charts and data charts as text, or sketch by hand. Free, open source, and runs in your browser." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Figvex",
        "url": "%SITE_URL%/",
        "description": "Free online diagram editor. Write PlantUML, Mermaid, Graphviz, BPMN, network diagrams, org charts and data charts as text, or sketch by hand, and see them drawn as you type in the browser.",
        "featureList": [
          "PlantUML: sequence, class, activity, use case, state, component, ER, Gantt, mind map and C4 diagrams",
          "Mermaid: flowcharts, sequence, Gantt, user journey, Git graph and more",
          "Graphviz DOT graphs with every layout engine",
          "BPMN 2.0 process diagrams",
          "Network diagrams with device icons, subnets, VLANs and IP address checks",
          "ER diagrams from SQL CREATE TABLE statements, with crow's foot links",
          "Org charts from an indented list of people",
          "Data charts with Apache ECharts, from JSON or CSV",
          "A freehand sketch canvas",
          "Export to SVG, PNG, JPG, WEBP and PDF",
          "Share links with the whole diagram in the URL"
        ],
        "sameAs": "https://github.com/ahmed-imraan-ai/figvex",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "softwareVersion": "%APP_VERSION%",
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "image": "%SITE_URL%/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem("figvex.settings.v1") || "{}");
        if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <h1 class="visually-hidden">Figvex: free online diagram editor for PlantUML, Mermaid and more</h1>
    <noscript>
      <p class="noscript">
        Figvex is a free online diagram editor. Write PlantUML, Mermaid, Graphviz, BPMN, network diagrams, org charts and data charts as text, or sketch by hand,
        and see them drawn as you type. It runs in your browser, so it needs JavaScript.
        Turn JavaScript on to use it, or see the source code on GitHub: https://github.com/ahmed-imraan-ai/figvex
      </p>
    </noscript>
    <div class="app" id="app">
      <header class="topbar">
        <button class="icon-btn" id="btn-library" type="button" aria-label="Your diagrams" aria-expanded="false" aria-controls="library"></button>
        <a class="brand" href="./" aria-label="Figvex">
          <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19C6.5 8 17.5 16 19 5" class="brand-curve" />
            <rect x="2.6" y="16.6" width="4.8" height="4.8" class="brand-anchor" />
            <rect x="16.6" y="2.6" width="4.8" height="4.8" class="brand-anchor" />
          </svg>
          <span class="brand-name">figvex</span>
        </a>
        <span class="env-badge" id="env-badge" hidden></span>
        <span class="topbar-sep" aria-hidden="true"></span>
        <label class="doc-title">
          <span class="visually-hidden">Diagram name</span>
          <input id="doc-title" type="text" spellcheck="false" autocomplete="off" maxlength="120" />
        </label>
        <span class="save-state" id="save-state" aria-live="polite"></span>

        <div class="topbar-spacer"></div>

        <nav class="topbar-actions" aria-label="Diagram actions">
          <button class="btn" id="btn-templates" type="button"><span class="btn-label">Templates</span></button>
          <button class="btn" id="btn-open" type="button"><span class="btn-label">Open</span></button>
          <button class="btn" id="btn-share" type="button" aria-haspopup="dialog"><span class="btn-label">Share</span></button>
          <button class="btn btn-ink" id="btn-export" type="button" aria-haspopup="dialog"><span class="btn-label">Export</span></button>
          <span class="topbar-sep" aria-hidden="true"></span>
          <button class="icon-btn" id="btn-settings" type="button" aria-label="Settings" aria-haspopup="dialog"></button>
          <button class="icon-btn" id="btn-help" type="button" aria-label="Help and about" aria-haspopup="menu" aria-expanded="false"></button>
          <a class="icon-btn" id="link-repo" target="_blank" rel="noopener" aria-label="Source code on GitHub" hidden></a>
        </nav>
      </header>

      <div class="mobile-tabs" role="tablist" aria-label="View">
        <button role="tab" id="tab-code" aria-selected="true" type="button">Code</button>
        <button role="tab" id="tab-diagram" aria-selected="false" type="button">Diagram</button>
      </div>

      <div class="workspace" id="workspace" data-view="code">
        <aside class="library" id="library" aria-label="Your diagrams"></aside>

        <section class="pane pane-editor" aria-label="Source">
          <div class="pane-head">
            <span id="language-picker"></span>
            <label class="style-picker" title="How diagrams are coloured. A !theme line in your diagram takes priority.">
              <span>Style</span>
              <select id="style-select" class="field" aria-label="Diagram style"></select>
            </label>
            <div class="topbar-spacer"></div>
            <button class="btn btn-small" id="btn-icons" type="button" title="Search and insert AWS, Azure, Google Cloud and Kubernetes icons" hidden>Icons</button>
            <a class="text-link" id="link-syntax" target="_blank" rel="noopener">Syntax reference</a>
          </div>
          <div class="editor-host" id="editor"></div>
        </section>

        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0"></div>

        <section class="pane pane-preview" aria-label="Diagram preview">
          <div class="stage" id="stage" tabindex="0" aria-label="Diagram. Drag to pan, Ctrl and scroll to zoom.">
            <div class="canvas" id="canvas"><div class="sheet" id="sheet"></div></div>
          </div>
          <div class="preview-message" id="preview-message" hidden></div>
          <div class="error-card" id="error-card" role="status" hidden></div>
          <div class="zoombar" role="group" aria-label="Zoom">
            <button class="icon-btn" id="zoom-out" type="button" aria-label="Zoom out"></button>
            <button class="zoom-level" id="zoom-level" type="button" title="Actual size (1)">100%</button>
            <button class="icon-btn" id="zoom-in" type="button" aria-label="Zoom in"></button>
            <span class="zoombar-sep" aria-hidden="true"></span>
            <button class="icon-btn" id="zoom-fit" type="button" aria-label="Fit to view (0)"></button>
          </div>
        </section>
      </div>

      <footer class="statusbar" id="statusbar">
        <span class="status-item" id="status-engine"></span>
        <span class="status-item status-render" id="status-render"></span>
        <span class="topbar-spacer"></span>
        <span class="status-item" id="status-cursor"></span>
        <a class="status-item status-link" id="powered-by" href="https://www.netlify.com" target="_blank" rel="noopener" hidden>This site is powered by Netlify</a>
      </footer>
    </div>

    <input type="file" id="file-input" accept=".puml,.plantuml,.pu,.iuml,.wsd,.mmd,.mermaid,.gv,.dot,.echarts,.json,.jsonc,.bpmn,.bpmn2,.xml,.sketch,.org,.orgchart,.network,.net,.sql,.ddl,.d2,.nomnoml,.noml,.wireframe,.wire,.structures,.ds,.wavedrom,.wavejson,.automaton,.fsm,.dfa,.nfa,.tm,.logic,.bool,.txt,.csv,.tsv,.md" hidden />
    <div class="drop-overlay" id="drop-overlay" hidden><p>Drop a .puml, .mmd, .gv, .bpmn or .csv file to open it</p></div>
    <div class="toast-host" id="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
