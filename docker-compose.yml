# Figvex on http://localhost:8080
#
#   docker compose up -d
#
# To keep every diagram on your own machines, start a PlantUML server too and
# point Figvex at it. It's only used for the diagram types the browser engine
# can't draw yet (Salt, ditaa, nwdiag and a few others):
#
#   VITE_PLANTUML_SERVER=http://localhost:8081 docker compose --profile server up -d --build

services:
  figvex:
    build:
      context: .
      args:
        VITE_REPO_URL: ${VITE_REPO_URL:-}
        VITE_PLANTUML_SERVER: ${VITE_PLANTUML_SERVER:-}
        VITE_PLANTUML_STDLIB_URL: ${VITE_PLANTUML_STDLIB_URL:-}
    image: figvex:latest
    ports:
      - "${FIGVEX_PORT:-8080}:8080"
    restart: unless-stopped

  plantuml-server:
    image: plantuml/plantuml-server:jetty
    profiles: ["server"]
    ports:
      - "${PLANTUML_SERVER_PORT:-8081}:8080"
    restart: unless-stopped
